# nginx reverse proxy for Curulia (run the portal with --trust-proxy).
# Kerberos SSO works through this proxy: nginx passes the Authorization and
# WWW-Authenticate headers unchanged. Do not enable any authentication in nginx itself.

server {
    listen 80;
    server_name curulia.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name curulia.example.com;   # must match kerberos.spn (HTTP/curulia.example.com)

    ssl_certificate     /etc/ssl/curulia/fullchain.pem;
    ssl_certificate_key /etc/ssl/curulia/privkey.pem;

    # Floor-plan uploads (keep above the "Maximum upload size" setting).
    client_max_body_size 25m;
    # Kerberos tickets with many groups make large headers.
    large_client_header_buffers 4 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
